<!DOCTYPE html>
  <html lang="es">
  <head>
    <meta charset="UTF-8">
    <title>Registro de usuarios - PEJ</title>
    <link rel="stylesheet" href="registro.css">
      <!-- PEJ-5: enlace de trazabilidad Jira-GitHub -->
    
  </head>
  <body>
    <main class="registro-container">
      <h1>Crear cuenta</h1>
      <form id="form-registro" novalidate>
        <label for="nombre">Nombre completo</label>
        <input type="text" id="nombre" name="nombre" required>

        <label for="email">Correo electronico</label>
        <input type="email" id="email" name="email" required>

        <label for="password">Contrasena</label>
        <input type="password" id="password" name="password" required minlength="8">

        <label for="password2">Confirmar contrasena</label>
        <input type="password" id="password2" name="password2" required minlength="8">

        <div id="form-errores" class="errores" aria-live="polite"></div>

        <button type="submit">Registrarme</button>
      </form>
    </main>
    <script src="registro.js"></script>
  </body>
  </html>
